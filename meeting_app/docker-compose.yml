version: '3.8'

services:
  mysql_db:
    image: mysql:8.0             
    container_name: meetings_db  
    restart: always              
    environment:
      MYSQL_ROOT_PASSWORD: root  
      MYSQL_DATABASE: meetings_app_db 
    ports:
      - "3306:3306"              
    volumes:
      - ./mysql_data:/var/lib/mysql 