<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>😎 Vacation Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h1 mb-3 text-center">⛱️ Create a vacation card ⛱️</h1>

      <form id="form" class="row g-2">
        <div class="col-12 col-sm-6">
          <label for="name" class="form-label">Vacation Name</label>
          <input id="name" type="text" class="form-control" placeholder="Where to?" required />
        </div>

        <div class="col-12 col-sm-6">
          <label for="url" class="form-label">Image URL</label>
          <input id="url" type="url" class="form-control" placeholder="Paste a photo link here" required />
        </div>

        <div class="col-6 col-sm-3">
          <label for="price" class="form-label">Price</label>
          <input id="price" type="number" class="form-control" min="1" placeholder="Enter price in $" required />
        </div>

        <div class="col-6 col-sm-3">
          <label for="rating" class="form-label">Rating</label>
          <select id="rating" class="form-select" required>
            <option value="">Select rating</option>
            <option value="bad">Poor (★☆☆☆)</option>
            <option value="regular">Fair (★★☆☆)</option>
            <option value="good">Good (★★★☆)</option>
            <option value="excellent">Excellent (★★★★)</option>
          </select>
        </div>

        <div class="col-12">
          <button id="save" type="button" class="btn btn-primary">Save</button>
        </div>
      </form>

      <div class="my-4"></div>

      <h2 class="h5 mb-3">Vacation Album</h2>
      <div id="cards" class="row g-3"></div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
