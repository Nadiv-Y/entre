<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Management</title>
    <link rel="stylesheet" href="/lib/normalize.css" />
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <script type="module" src="/Projects/FirstProject/script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h2>My Task Board</h2>
      <form action="" method="get" id="taskForm" class="notebook">
        <div class="input-form">
          <label for="task">Enter Your Task: </label>
          <input type="text" name="task" id="formTask" required placeholder="i want to make a pizza!" />
        </div>
        <div class="input-form">
          <label for="date">Deadline Task: </label>
          <input type="date" name="date" id="FormDate" required placeholder="dd/mm/yyyy" />
        </div> 
          <div class="input-form">
            <label for="time">Deadline Task: </label>
            <input type="time" name="time" id="formTime" required />
          </div> 
        <div class="input-form">
          <input type="submit" id="save" value="Save" />
          <input type="reset" value="Reset" />
        </div>
      </form>
    </div>
    <div id="task-container"></div>
  </body>
</html>
