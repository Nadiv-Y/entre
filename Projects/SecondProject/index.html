<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strategy</title>

    <link rel="stylesheet" href="/lib/normalize.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="p-3 bg-dark text-white mb-4">
      <div class="progress position-absolute top-0 start-0 w-100" style="height: 10px">
        <div class="progress-bar progress-bar-striped progress-bar-animated" id="progressBarMain" role="progressbar"></div>
      </div>
      <div class="container">
        <div class="d-flex flex-column flex-md-row flex-wrap align-items-center justify-content-center gap-3">
          <div class="d-flex">
            <img src="/Projects/SecondProject/icons8-bitcoin-48.png" style="width: 48px; height: 48px" class="bi me-1" alt="Strategy_Logo" />
            <h2>Strategy</h2>
          </div>

          <ul class="nav col-auto mb-2 mb-md-0">
            <li><a href="#" class="nav-link px-2 text-secondary">Home</a></li>
            <li><a href="#" class="nav-link px-2 text-white">Live Reports</a></li>
            <li><a href="#" class="nav-link px-2 text-white">About</a></li>
          </ul>

          <form class="d-flex col-12 col-md-auto mb-3 mb-md-0 ms-md-auto align-items-center gap-1">
            <input type="search" class="form-control form-control-dark" id="filterInpt" placeholder="Search coins..." aria-label="Search" />
          </form>
        </div>
      </div>
    </header>

    <div class="container-fluid container-sm w-sm-75 w-100">
      <div class="row row-cols-sm-3 row-cols-1 justify-content-center m-4" id="cryptoContainer"></div>
    </div>

    <script type="module" src="/Projects/SecondProject/script.js"></script>
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
