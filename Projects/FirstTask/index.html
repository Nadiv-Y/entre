  <body class="bg-light">
    <div class="container d-flex flex-column justify-content-center align-items-center p-3">
      <form id="cardForm" class="border rounded p-4 shadow w-100">
        <h3 class="mb-4 text-center"><i class="bi bi-airplane-fill"></i> Vacation Planer <i class="bi bi-airplane-fill"></i></h3>
        <div class="row">
          <div class="col-md-3 mb-3">
            <label for="tripIdea" class="form-label m-1">Trip Name</label>
            <input type="text" class="form-control" id="tripIdea" placeholder="Washington D.C" required />
          </div>
          <div class="col-md-3 mb-3">
            <label for="tripURL" class="form-label m-1">Vacation URL</label>
            <input type="text" class="form-control" id="tripURL" placeholder="example.png" required />
          </div>
          <div class="col-md-3 mb-3">
            <label for="tripPrice" class="form-label m-1">Vacation Price</label>
            <input type="number" class="form-control" id="tripPrice" placeholder="$2000" min="0" required />
          </div>
          <div class="col-md-3 mb-3">
            <label for="tripRating" class="form-label m-1">Rating</label>
            <select class="form-select" id="tripRating" required>
              <option selected value="" disabled>Choose...</option>
              <option value="4">Excellent</option>
              <option value="3">Good</option>
              <option value="2">Regular</option>
              <option value="1">Bad</option>
            </select>
          </div>
        </div>
        <div class="d-grid mt-3">
          <input type="submit" class="btn btn-primary" id="submitBtn" value="Submit form" />
        </div>
      </form>
      <div id="cardContainer" class="w-100 flex-nowrap overflow-auto d-flex align-items-start scroll-behavior-smooth gap-4 mt-2 p-2">
