<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vacation Trip</title>
    <link rel="stylesheet" href="/lib/normalize.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center p-3">
      <form class="border rounded p-4 shadow w-100" style="max-width: 900px">
        <h3 class="mb-4 text-center">
          <i class="bi bi-airplane-fill"></i> Vacation Planer <i class="bi bi-airplane-fill"></i>
        </h3>
        <div class="row">
          <div class="col-md-3 mb-3">
            <label for="tripIdea" class="form-label m-1">Trip Idea</label>
            <input type="text" class="form-control" id="tripIdea" placeholder="Washington D.C" required />
          </div>
          <div class="col-md-3 mb-3">
            <label for="tripURL" class="form-label m-1">Vacation URL</label>
            <input type="text" class="form-control" id="tripURL" placeholder="example.png" required />
          </div>
          <div class="col-md-3 mb-3">
            <label for="tripPrice" class="form-label m-1">Vacation Price</label>
            <input type="number" class="form-control" id="tripPrice" placeholder="$2000" min="0" required />
          </div>
          <div class="col-md-3 mb-3">
            <label for="tripRating" class="form-label m-1">Rating</label>
            <select class="form-select" id="tripRating" required>
              <option selected value="" disabled>Choose...</option>
              <option value="excellent">Excellent</option>
              <option value="good">Good</option>
              <option value="regular">Regular</option>
              <option value="bad">Bad</option>
            </select>
          </div>
        </div>
        <div class="d-grid mt-3">
          <button class="btn btn-primary" type="submit">Submit form</button>
        </div>
      </form>
    </div>
  </body>
</html>
