<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ms+Madi&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="task.css">
   

</head>

<body>
    <div class="imageDiv">
    <div class="topContainer">
    <h1> Vacation Mode On</h1>
    <div class= "formDiv">
        <form action="" class="form row g-2 px-5 needs-validation" novalidate>
            <div class="col-md-2">
                <label for="vacationName" class="form-label"> Vacation name  </label>
                <input type = "text" class="form-control" id="vacationName" required> 
                    <div class="invalid-feedback">
                        Please choose a vacation name.
                    </div>
            </div>

            <div class="col-md-2">
                <label for="image" class="form-label"> Img URL  </label>
                <input type = "text" class="form-control" id="image" required> 
                    <div class="invalid-feedback">
                        Please insert an img URL.
                    </div>
                    
            </div>

            <div class="col-md-2">
                <label for ="price" class="form-label">Vacation Price </label>
                <input type="number" class="form-control" id="price" style="">
                    <div class="invalid-feedback">
                        Please insert vacation price.
                    </div>
            </div>

            <div class="col-md-3"> 
                <label for="vacationRate" class="form-label">Rate the vacation</label>
                <select class="form-select" aria-label="Default select example">
                    <option selected>Choose</option>
                    <option value="1">bad</option>
                    <option value="2">regular</option>
                    <option value="3">good</option>
                    <option value="4">excellent</option>
                </select>
                <div class="invalid-feedback">
                    Please select a valid rate.
                </div>
            </div>
           
           <div class="col-auto ms-auto"> 
            <button type="submit" class="btn btn-dark">  SAVE   </button>
            </div>

            
                    </form>
                <div class="container" style="margin-top: 15vh;">
                    <div class="d-flex flex-row flex-wrap mb-3 justify-content-center" id="papaDiv"></div>
                </div>
    </div>
    </div>
</div>
    <script src="task.js"></script>
</body>
</html>
