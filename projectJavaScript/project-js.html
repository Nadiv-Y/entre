<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="project-js.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container1">
        <img class="title" src="./lib-project/title.png" alt="title" />
        <div class="line-notebook-form">
            <div class="content">
                <img src="./lib-project/formbg.jpg" alt="line-notebook" class="img-line-notebook">
                <img src="./lib-project/formbg.jpg" alt="line-notebook" class="img-line-notebook">
                <textarea class="form-control" id="textReminder" placeholder="הקלד תזכורת" required></textarea>
                <input type="date" class="note-date form-control " id="date" required>
                <input type="time" class="note-time form-control " id="time" required>
                <button type="button" class="note-creat btn btn-dark d-flex justify-content-center align-items-center "
                    id="clickCreat">Create</button>
                <button type="button" class="note-reset btn btn-light d-flex justify-content-center align-items-center "
                    id="clickReset">Reset</button>
               
            </div>

        </div>
        <div id="reminderNotes" class=" reminderNotes d-flex  flex-wrap">



        </div>
    </div>
    <script src="project-js.js"></script>
</body>


</html>
