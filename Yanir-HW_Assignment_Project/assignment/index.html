
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yanir's Assignment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<h3 class="display-6 fw-bold text-center rounded mb-4">Vacation Rater</h3>
  <form id="vacationForm">
    
    <input type="text" id="name" placeholder="Vacation name" required>
    <input type="url" id="image" placeholder="Image URL" required>
    <input type="number" id="price" placeholder="Price $" required>
    <select id="rating" required>
      <option value="">Rating</option>
      <option value="4">Excellent</option>
      <option value="3">Good</option>
      <option value="2">Regular</option>
      <option value="1">Bad</option>
    </select>
    <button type="submit" class="">Save</button>
  </form>

  <div class="cards" id="cardsContainer"></div>

  <script src="index.js"></script>
</body>
</html>
