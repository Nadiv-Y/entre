<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanir's Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="headline">
        <h1 class="fw-bold">לוח משימות</h1>
    </div>
    <div class="container">
    <img src="paper.jpg" class="bg" alt="background">
    <form id="task-form" class="form">
      <textarea id="task-text" placeholder="...הכנס נתוני משימה" required></textarea>
      <div class="controls">
          <input type="date" id="task-date" required><label for="task-date">בחר תאריך לביצוע</label>
          <input type="time" id="task-time" required><label for="task-time">בחר שעת יעד</label>
            <button type="reset" id="clear">Clear</button>
             <button type="submit" id="save">Save</button>
      </div>
    </form>
  </div>

  <div class="notes" id="notes-container">
  </div>
  <script src="project.js"></script>
</body>
</html>
