<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>לוח משימות</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="container py-5">
    <h1 class="text-center mb-4">לוח המשימות שלי</h1>

    <div class="taskInput mb-5">
      <form id="taskForm" class="row g-3">
        <div class="col-md-6">
          <label for="task" class="form-label">המשימה:</label>
          <input type="text" id="task" class="form-control" required />
        </div>
        <div class="col-md-3">
          <label for="taskDate" class="form-label">תאריך:</label>
          <input type="date" id="taskDate" class="form-control" />
        </div>
        <div class="col-md-3">
          <label for="taskTime" class="form-label">שעה:</label>
          <input type="time" id="taskTime" class="form-control" />
        </div>
        <div class="col-12 d-flex gap-3 mt-3">
          <button type="button" class="btn btn-dark" id="add-item">
            הוסף משימה
          </button>
          <button type="reset" class="btn btn-outline-secondary">איפוס</button>
        </div>
      </form>
    </div>

    <div class="row g-4" id="notesGrid"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/11lesson/11lesson/project-js-css-html/index.js"></script>
  </body>
</html>
