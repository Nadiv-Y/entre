<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holidays</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/normalize/normalize.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>

    <div class="container d-flex flex-column align-items-center justify-content-center vh-100">

        <div class="row w-100">

            <div class="col-md-6 mb-5 border rounded mt-3">
                <h1>Holidays Form</h1>

                <form class="d-flex flex-column p-3 sticky-form" id="holidayForm">
                    <div class="form-group">

                        <label class="mt-3" for="holidayName">Holiday Name:</label>
                        <input type="text" class="form-control mb-2" id="holidayName" placeholder="Holiday Name"
                            required>

                        <label class="mt-3" for="holidayImage">Holiday Image URL:</label>
                        <input type="url" class="form-control mb-2" id="holidayImage" placeholder="Image URL" required>

                        <label class="mt-3" for="holidayCost">Holiday Cost:</label>
                        <input type="number" class="form-control mb-2" id="holidayCost" placeholder="Cost" required>

                        <label class="mt-3" for="holidayRating">Holiday Rating:</label>
                        <select class="form-select mb-2" name="Holiday Rating" id="holidayRating" required>
                            <option>Excellent</option>
                            <option>Good</option>
                            <option>Regular</option>
                            <option>Bad</option>
                        </select>

                        <button class="btn btn-primary col-12 mt-2" id="holidaySubmit" type="button">Add
                            Holiday</button>

                    </div>
                </form>
            </div>


            <div class="col-md-6">
                <h2 class="mt-5">Holidays List</h2>
                <ul id="holidayList" class="list-group mt-3"></ul>
            </div>

        </div>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
        <script src="index.js"></script>
</body>

</html>
