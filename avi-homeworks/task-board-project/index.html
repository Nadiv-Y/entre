<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Task Board</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container py-4">
        <h1 class="text-center custom-font mb-4">My Task Board</h1>

        <form id="task-form" class="p-4 rounded shadow-sm mb-4 form-background">
            <div class="mb-3">
                <input type="text" id="task-text" class="form-control" placeholder="Enter task..." required />
            </div>
            <div class="mb-3">
                <input type="date" id="task-date" class="form-control" required />
            </div>
            <div class="mb-3">
                <input type="time" id="task-time" class="form-control" required />
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Add Task</button>
                <button type="reset" class="btn btn-secondary">Clear</button>
            </div>
        </form>

        <div id="task-board" class="d-flex flex-wrap gap-3"></div>
    </div>

    <script type="module" src="index.js"></script>
</body>

</html>
