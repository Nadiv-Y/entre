<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Cryptonite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="container py-4">
    <div class="d-flex align-items-center justify-content-between brand-wrap">
      <h1 class="display-6 mb-0 text-ellipsis-1">Cryptonite</h1>
      <img class="brand-crystal img-fluid"
        src="https://img.freepik.com/premium-vector/beautiful-blue-clear-crystal_317810-3267.jpg" alt="Crystal" />
    </div>
  </header>

  <section class="container">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
      <ul class="nav nav-pills app-pills">
        <li class="nav-item">
          <a class="nav-link active" href="#" data-route="home">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-route="reports">Live Reports</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-route="about">About</a>
        </li>
      </ul>

      <form id="searchForm" class="d-flex gap-2" role="search">
        <input id="searchInput" class="form-control" type="search" placeholder="Search by symbol (e.g., BTC)"
          aria-label="Search" />
        <button class="btn btn-outline-success fx-no-shrink" type="submit">Search</button>
      </form>
    </div>
  </section>

  <div id="progressWrap" class="progress d-none">
    <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div>
  </div>

  <main id="app" class="container py-3">
  </main>

  <div class="modal fade" id="limitModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Selected coins limit reached (5)</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-2">You can keep up to 5 coins in Live Reports. Uncheck one to add a new coin:</p>
          <div id="modalList" class="list-group small"></div>
        </div>
        <div class="modal-footer">
          <button id="modalCancel" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button id="modalSave" type="button" class="btn btn-primary" data-bs-dismiss="modal">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.canvasjs.com/canvasjs.min.js"></script>
  <script type="module" src="index.js"></script>
</body>

</html>
