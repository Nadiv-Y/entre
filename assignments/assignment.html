<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Vacation</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container py-4">
      <h1 class="text-center mb-4">Vacation manager.</h1>

      <form id="vacation-form" class="card p-4 shadow-sm mb-3">
        <div class="row">
          <div class="col-md-6 form-group mb-2">
            <label for="vacation-name">Vacation Name:</label>
            <input
              type="text"
              id="vacation-name"
              name="name"
              class="form-control"
              placeholder="Enter vacation name"
            />
          </div>

          <div class="col-md-6 form-group mb-2">
            <label for="vacation-img">Vacation picture:</label>
            <input
              type="text"
              id="vacation-img"
              class="form-control"
              placeholder="Enter picture URL"
            />
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 form-group mb-2">
            <label for="vacation-price">Price:</label>
            <input type="number" id="vacation-price" class="form-control" placeholder="Enter price" />
          </div>

          <div class="col-md-6 form-group mb-2">
            <label for="vacation-rating">Rate your vacation</label>
            <select id="vacation-rating" class="form-select">
              <option>Excellent</option>
              <option>Good</option>
              <option>Regular</option>
              <option>Bad</option>
            </select>
          </div>
        </div>

        <button type="button" id="save-vacation" class="btn btn-primary">
          Save
        </button>
      </form>
    </div>

    <div
      id="vacation-cards"
      class="d-flex flex-wrap gap-4 justify-content-center"
    ></div>

    <script src="./assignment.js"></script>
  </body>
</html>
