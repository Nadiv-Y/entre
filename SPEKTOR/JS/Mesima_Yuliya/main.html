<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tour List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    .card-img-top { height: 200px; object-fit: cover; }
    .like-btn { cursor: pointer; color: blue; }
  </style>
</head>
<body>
  <div class="container py-4">
    <h1 class="text-center mb-4">All Tours</h1>
    <div class="d-flex justify-content-between mb-3">
      <a href="form.html" class="btn btn-success">+ Add Tour</a>
      <input id="searchBox" type="text" placeholder="Search tours..." class="form-control w-50">
    </div>
    <div id="tourContainer" class="row"></div>
  </div>
  <script>
    const tourContainer = document.getElementById('tourContainer');
    const searchBox = document.getElementById('searchBox');
    let tours = JSON.parse(localStorage.getItem('tours')) || [];

    function renderTours(filter = '') {
      tourContainer.innerHTML = '';
      const filtered = tours.filter(t => t.name.toLowerCase().includes(filter.toLowerCase()));
      if (filtered.length === 0) {
        tourContainer.innerHTML = '<p class="text-center">No tours found.</p>';
        return;
      }
      filtered.forEach((tour, index) => {
        const card = document.createElement('div');
        card.className = 'col-md-4 mb-4';
        card.innerHTML = `
          <div class="card">
            <img src="${tour.imageURL || 'https://via.placeholder.com/400x200'}" class="card-img-top" alt="Tour Image">
            <div class="card-body">
              <h5 class="card-title">${tour.name}</h5>
              <p class="card-text">${tour.description}</p>
              <p>Price: ${tour.price} ${tour.currency}</p>
              <p>Rating: ${'⭐'.repeat(tour.rating)}</p>
              <p><span class="like-btn" onclick="likeTour(${index})">👍</span> <span id="like-${index}">${tour.likes}</span> likes</p>
              <div class="d-flex justify-content-between mt-3">
                <button class="btn btn-sm btn-outline-primary" onclick="editTour(${index})">Edit</button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteTour(${index})">Delete</button>
              </div>
            </div>
          </div>`;
        tourContainer.appendChild(card);
      });
    }

    function likeTour(index) {
      tours[index].likes++;
      localStorage.setItem('tours', JSON.stringify(tours));
      renderTours(searchBox.value);
    }

    function deleteTour(index) {
      if (confirm('Are you sure you want to delete this tour?')) {
        tours.splice(index, 1);
        localStorage.setItem('tours', JSON.stringify(tours));
        renderTours(searchBox.value);
      }
    }

    function editTour(index) {
      localStorage.setItem('editTourIndex', index);
      window.location.href = 'edit.html';
    }

    searchBox.addEventListener('input', () => renderTours(searchBox.value));
    renderTours();
  </script>
</body>
</html>
