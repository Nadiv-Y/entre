<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add New Tour</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light py-4">
  <div class="container">
    <h1 class="mb-4">Add a New Tour</h1>
    <form id="tourForm">
      <div class="mb-3">
        <label for="tourName" class="form-label">Tour Name</label>
        <input type="text" class="form-control" id="tourName" required />
      </div>
      <div class="mb-3">
        <label for="tourDescription" class="form-label">Description</label>
        <textarea class="form-control" id="tourDescription" rows="4"></textarea>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="price" class="form-label">Price</label>
          <input type="number" class="form-control" id="price" required />
        </div>
        <div class="col-md-6">
          <label for="currency" class="form-label">Currency</label>
          <select class="form-select" id="currency">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="NIS" selected>NIS</option>
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label for="rating" class="form-label">Rating</label>
        <select class="form-select" id="rating">
          <option value="5">★ ★ ★ ★ ★ Excellent</option>
          <option value="4">★ ★ ★ ★ ☆ Good</option>
          <option value="3">★ ★ ★ ☆ ☆ Regular</option>
          <option value="2">★ ★ ☆ ☆ ☆ Bad</option>
          <option value="1">★ ☆ ☆ ☆ ☆ Not Recommended</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="imageURL" class="form-label">Image URL</label>
        <input type="url" class="form-control" id="imageURL" placeholder="https://example.com/image.jpg"/>
      </div>
      <div class="d-flex gap-2 justify-content-end">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="reset" class="btn btn-secondary">Reset</button>
        <a href="main.html" class="btn btn-danger">Cancel</a>
      </div>
    </form>
  </div>
  <script>
    const form = document.getElementById('tourForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const tour = {
        name: document.getElementById('tourName').value,
        description: document.getElementById('tourDescription').value,
        price: document.getElementById('price').value,
        currency: document.getElementById('currency').value,
        rating: parseInt(document.getElementById('rating').value),
        imageURL: document.getElementById('imageURL').value,
        likes: 0
      };
      const tours = JSON.parse(localStorage.getItem('tours')) || [];
      tours.push(tour);
      localStorage.setItem('tours', JSON.stringify(tours));
      window.location.href = "main.html";
    });
  </script>
</body>
</html>
