<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Task Board</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f9f2e7;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 20px;
    }

    #taskForm {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    #taskForm input, #taskForm button {
      height: 40px;
    }

    .note {
      width: 200px;
      height: 200px;
      background-color: #fffac8;
      border: 2px solid #f4d03f;
      border-radius: 10px;
      box-shadow: 3px 3px 10px rgba(0,0,0,0.1);
      margin: 10px;
      padding: 10px;
      position: relative;
      transition: transform 0.3s ease-in-out;
    }

    .note:hover {
      transform: scale(1.02);
    }

    .note .delete {
      position: absolute;
      top: 5px;
      right: 10px;
      color: white;
      background-color: #e74c3c;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
      line-height: 1;
    }

    .note .timestamp {
      position: absolute;
      bottom: 5px;
      right: 10px;
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>My Task Board</h1>
  <div class="container">
    <form id="taskForm">
      <input type="text" id="taskText" class="form-control" placeholder="Task description" required />
      <input type="date" id="taskDate" class="form-control" required />
      <input type="time" id="taskTime" class="form-control" required />
      <button type="submit" class="btn btn-success">Add Task</button>
    </form>
    <div id="taskBoard" class="d-flex flex-wrap justify-content-center"></div>
  </div>

  <script>
    const taskForm = document.getElementById('taskForm');
    const taskBoard = document.getElementById('taskBoard');

    function loadTasks() {
      taskBoard.innerHTML = '';
      const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
      tasks.forEach(addNoteToBoard);
    }

    function saveTask(task) {
      const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
      tasks.push(task);
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function deleteTask(index) {
      let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
      tasks.splice(index, 1);
      localStorage.setItem('tasks', JSON.stringify(tasks));
      loadTasks();
    }

    function addNoteToBoard(task, index) {
      const note = document.createElement('div');
      note.className = 'note';
      note.innerHTML = `
        <span class="delete" onclick="deleteTask(${index})">×</span>
        <p>${task.text}</p>
        <div class="timestamp">${task.date} ${task.time}</div>
      `;
      taskBoard.appendChild(note);
    }

    taskForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const text = document.getElementById('taskText').value.trim();
      const date = document.getElementById('taskDate').value;
      const time = document.getElementById('taskTime').value;

      if (!text || !date || !time) return;

      const task = { text, date, time };
      saveTask(task);
      loadTasks();
      taskForm.reset();
    });

    window.onload = loadTasks;
  </script>
</body>
</html>
