<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="https://formspree.io/f/mrbqzape">
        <div class="container">
            <div class="box">
                <h1>contect us</h1>
            </div>
            <div class="box">
                <h2>i'd relly like to hear from you!</h2>
            </div>
            <div class="box">
                <label for="firstName">First Name:</label>
                <input type="text" name="firstName" id="firstName" placeholder="Amit" autofocus required>
            </div>
            <div class="box">
                <label for="lastName">Last Name:</label>
                <input type="text" name="lastName" id="lastName" placeholder="David" required>
            </div>
            <div class="box">
                <label for="password">password:</label>
                <input type="password" name="password" id="password" required>
            </div>
            <div class="box">
                <label for="phone">Phone:</label>
                <input type="tel" name="phone" id="phone" pattern="[0-9]{3}[0-9]{3}[0-9]{4}" placeholder="054-911-6055">
            </div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
    </form>
</body>

</html>
