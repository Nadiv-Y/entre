<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Collapse Columns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .collapse-card {
      position: absolute;
      z-index: 10;
      width: 100%;
      top: 100%; /* Position right below the button */
      left: 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .col-wrapper {
      position: relative; /* Needed for absolute positioning inside */
    }
  </style>
</head>
<body>
  <div class="container my-5">

    <!-- Row 1 -->
    <div class="row">
      <div class="col-md-4">
        <button class="btn btn-primary w-100" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCol1">
          Toggle Column 1
        </button>
        <div class="collapse collapse-card" id="collapseCol1">
          <div class="card card-body">Content 1</div>
        </div>
      </div>
      <div class="col-md-4 col-wrapper">
        <button class="btn btn-success w-100" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCol2">
          Toggle Column 2
        </button>
        <div class="collapse collapse-card" id="collapseCol2">
          <div class="card card-body">Content 2</div>
        </div>
      </div>
      <div class="col-md-4 col-wrapper">
        <button class="btn btn-warning w-100" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCol3">
          Toggle Column 3
        </button>
        <div class="collapse collapse-card" id="collapseCol3">
          <div class="card card-body">Content 3</div>
        </div>
      </div>
    </div>

    <!-- Row 2 -->
    <div class="row">
      <div class="col-md-4 col-wrapper">
        <button class="btn btn-info w-100" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCol4">
          Toggle Column 4
        </button>
        <div class="collapse collapse-card" id="collapseCol4">
          <div class="card card-body">Content 4</div>
        </div>
      </div>
      <div class="col-md-4 col-wrapper">
        <button class="btn btn-danger w-100" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCol5">
          Toggle Column 5
        </button>
        <div class="collapse collapse-card" id="collapseCol5">
          <div class="card card-body">Content 5</div>
        </div>
      </div>
      <div class="col-md-4 col-wrapper">
        <button class="btn btn-secondary w-100" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCol6">
          Toggle Column 6
        </button>
        <div class="collapse collapse-card" id="collapseCol6">
          <div class="card card-body">Content 6</div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
