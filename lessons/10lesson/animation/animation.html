<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .spinner{
            width: 200px;
            height: 200px;
            position: relative;
            top: 100px;
            left: 100px;
            background-color: rgb(105, 180, 223);
            border-radius: 5%;
            animation-name: spin;
            animation-duration: 8s ;
            /* animation-delay: 4s; */
        }

        .spinner:hover{
            animation-play-state: running;
        }

        @keyframes spin {
            0%{
                scale: 0.5;
            }
            50%{
                scale: 1.5;
                transform: rotate(0deg);
            }
            100%{
                scale: 1.5;
                transform: rotate(360deg);
            }
        }
        .spinner-text{
            text-align: center;
            margin: auto;
        }
        div{
            top: 100px;
        }


    </style>
</head>
<body>
    <div class="spinner">
        <p class="spinner-text">fuck you</p>
        <div><img style="width: 50px; height: 50px;" src="/lessons/10lesson/animation/img.png" alt=""></div>
    </div>
</body>
</html>
