<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/7lesson/forms/style.css">
</head>
<body>
    <h1>pleas register</h1>
    <form action="https://formspree.io/f/mrbqzape" method="post">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
        </div>
        <div class="form-group">
            <label for="pass">password</label>
            <input type="password" id="pass" name="password">
        </div>
        <div class="form-group">
            <label for="exp">years of experience</label>
            <input type="number" id="exp" min="0" max="40" name="years os experience">
        </div>
        </div>
        <div class="form-group">
            <label for="date">date of birth</label>
            <input type="date" id="date" min="1945" max="2025" name="date of birth">
        </div>
        <div class="form-group">
            <label for="moblie">phone number</label>
            <input type="tel" id="moblie" name="phone number">
        </div>
        <div class="form-group">
            <label for="textarea">notes</label>
            <textarea type="text" id="textarea" name="notes" rows="2"></textarea>
        </div>
        <div class="form-group">
            <label for="prof">proffesional</label>
            <input id="prof" list="prof">
            <datalist id="prof">
                <option>front end</option>
                <option>back end</option>
                <option>full stack</option>
            </datalist>
        </div>
        <!-- you can add pettarn or placeholder or velue ( if you want defuelt)-->
        <div><input type="submit"></div>
    </form>
</body>
</html>
