<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project 1 — Task Board</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" />

    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container">
      <h1 class="text-center page-title">My Task Board</h1>

      <form id="form" class="form-paper">
        <div class="form-group">
          <label for="task">Task</label>
          <input id="task" type="text" class="form-control" placeholder="What do you need to do?" required />
        </div>

        <div class="row">
          <div class="col-xs-12 col-sm-6">
            <div class="form-group">
              <label for="date">Due date</label>
              <input id="date" type="date" class="form-control" required />
            </div>
          </div>
          <div class="col-xs-12 col-sm-6">
            <div class="form-group">
              <label for="time">Due time</label>
              <input id="time" type="time" class="form-control" required />
            </div>
          </div>
        </div>

        <div class="btn-row">
          <button id="save" type="button" class="btn btn-primary">Save</button>
          <button type="reset" class="btn btn-default">Reset</button>
        </div>
      </form>

      <h2 class="h5">Tasks</h2>
      <div id="board" class="row"></div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
