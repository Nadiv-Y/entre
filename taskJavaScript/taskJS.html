<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="taskJS.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <!-- <img src="תמונת+נוף+-+שוויץ.jpg" alt="landscape"  class="img-landscape"> -->
    <div class="container1">
    <h1 class="titel">Vacation management</h1>
    
    <form action="" class="form">
        <label for="nameVacation">Name vacation:
            <input type="text" id="nameVacation" placeholder="Name vacation" class="form-control" required>
        </label>
        <label for="imgFromVacation">Enter image url:
            <input type="text" id="imgFromVacation" placeholder="https://example.com/users/" class="form-control"required>
            
        </label>
        <label for="priceVacation">Price:
            <div class="input-group mb-3 price">
                <span class="input-group-text">₪</span>
                <input type="text" class="form-control " id="price" aria-label="Amount (to the nearest shkel chadash)">
               
            </div>
        </label>
        <label for="vacationRating">Rating:
            <select name="rating" id="vacationRating" class="form-select" required>
                <option value="excellent">Excellent</option>
                <option value="good">Good</option>
                <option value="regular">Regular</option>
                <option value="bad">Bad</option>
            </select>
        </label>
        <label for="btn-save" class="label-save">
            <button type="button" class="btn btn-save" id="btn-save">Save</button>
        </label>
 
    </form>
    <div id="cardsVacation" class="cardsVacation">

    </div>



</div>

    <script src="taskJS.js"></script>
</body>

</html>
