<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1 class="text-center mb-4">לוח חופשות</h1>

    <div class="taskInput mb-5">
      <form id="vacationForm" class="row g-3">
        <div class="col-md-6">
          <label for="vacationName" class="form-label">שם חופשה:</label>
          <input type="text" id="vacationName" class="form-control" required />
        </div>
        <div class="col-md-6">
          <label for="vacationPhoto" class="form-label"
            >קישור לתמונה מהחופשה:</label
          >
          <input type="text" id="vacationPhoto" class="form-control" required />
        </div>
        <div class="col-md-6">
          <label for="vacationPrice" class="form-label">מחיר החופשה:</label>
          <input
            type="number"
            id="vacationPrice"
            class="form-control"
            required
          />
        </div>
        <div class="col-md-3">
          <label for="vacationRating">דירוג החופשה:</label>
          <select id="vacationRating" class="form-select" name="vacationRating">
            <option value="excellent">מצוין</option>
            <option value="good">טוב</option>
            <option value="regular">רגיל</option>
            <option value="bad">גרוע</option>
          </select>
        </div>
        <div class="col-12 d-flex gap-3 mt-3">
          <button type="button" class="btn btn-dark" id="add-item">
            פרסם חופשה
          </button>
          <button type="reset" class="btn btn-outline-secondary">איפוס</button>
        </div>
      </form>
    </div>
    <div class="row g-4" id="notesGrid"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/11lesson/11lesson/javascript-HTML5-Task/index.js"></script>
  </body>
</html>
