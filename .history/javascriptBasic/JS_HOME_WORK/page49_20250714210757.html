<!DOCTYPE html>

  <body>
    <script>
      console.log("=firstQ=");
      function matrixUntil_100(rows, cols) {
        const matrix = [];
        let value = 0;
        for (let i = 0; i < rows; i++) {
          const row = [];
          for (let j = 0; j < cols; j++) {
            row.push(value++);
          }
          matrix.push(row);
        }
        return matrix;
      }
      console.table(matrixUntil_100(10, 10));

      console.log("=secondQ");
      function matrixCross(rows, cols) {
        const matrix = [];
        let value = 0;
        for (let i = 0; i < rows; i++) {
          const row = [];
          for (let j = 0; j < cols; j++) {
            if (i === j || i + j === cols - 1) {
              row.push(value + 1);
            } else {
              row.push(value);
            }
          }
          matrix.push(row);
        }
        return matrix;
      }
      console.table(matrixCross(10, 10));

      console.log("=thirdQ");
      function thirdMatrix(rows, cols) {
        const matrix = [];
        let value = 0;
        for (let i = 0; i < rows; i++) {
          const row = [];
          for (let j = 0; j < cols; j++) {
            let rowNum = row.push(value++);
            let sum = rowNum + rowNum[j + 1];
          }
          matrix.push(row);
        }
        return matrix;
      }
      const table_1 = thirdMatrix(10, 10);
      console.table(table_1);
      console.log("the row number with the largest sum is: " + table_1[9]);

      console.log("=forthQ");
      function fiveSeven(rows, cols) {
        const matrix = [];
        let value = 0;
        for (let i = 0; i < rows; i++) {
          const row = [];
          for (let j = 0; j < cols; j++) {
            if (value % 5 === 0 || value % 7 === 0) {
              row.push(0);
            } else {
              row.push(value);
            }
            value++;
          }
          matrix.push(row);
        }
        return matrix;
      }

      console.table(fiveSeven(10, 10));

      console.log("=eightQ");

      function frame(rows, cols) {
        const matrix = [];
        let value = 0;
        for (let i = 0; i < rows; i++) {
          const row = [];
          for (let j = 0; j < cols; j++) {
            if (
              value < 10 ||
              value % 10 === 0 ||
              value > 90 ||
              (value - 9) % 10 === 0
            ) {
              row.push(1);
            } else if (
              (value < 20) ||
              (value - 1) % 10 === 0 ||
              value > 80 ||
              (value - 8) % 10 === 0
            ) {
              row.push(2);
            } else if (
              (value < 30) ||
              (value - 2) % 10 === 0 ||
              value > 70 ||
              (value - 7) % 10 === 0
            ) {
              row.push(3);
            } else if (
              (value < 40) ||
              (value - 3) % 10 === 0 ||
              value > 60 ||
              (value - 6) % 10 === 0
            ) {
              row.push(4);
            } else if
            (value > 40||
            value < 50)
            {
                row.push(5)
            }
            row.push(value);
            value++;
          }
          matrix.push(row);
        }
        return matrix;
      }

      console.table(frame(10, 10));
    </script>
  </body>
