      console.log("=firstQ=");
      function matrixUntil_100(rows, cols) {
        const matrix = [];
        let value = 0;
        for (let i = 0; i < rows; i++) {
          const row = [];
          for (let j = 0; j < cols; j++) {
            row.push(value++);
          }
          matrix.push(row);
        }
        return matrix;
      }
      console.table(matrixUntil_100(10, 10));

           if(row.indexOf()===cols[j]){
