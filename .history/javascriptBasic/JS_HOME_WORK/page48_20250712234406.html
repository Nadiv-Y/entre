    <script>
      console.log("=firstQ=");
      function createMatrix (rows, cols){
        const matrix = [];
        let value = 1;
        for(let i = 0; i < rows; i++){
            const rows = [];
            for(let j = 0; j < cols; j++){
                rows.push(value++)
            }
            matrix.push(rows)
        }
        return matrix
      }
      const myArray = createMatrix(7,4)

      console.table(myArray);
      
      
    </script>
