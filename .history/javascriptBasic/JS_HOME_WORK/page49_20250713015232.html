    <script>
        console.log('=firstQ=');
        function matrixUntil_100 (rows, cols){
            const matrix = [];
            let value = 0;
            for(let i = 0; i < rows; i++){
                const rows = [];
                for(let j = 0;j < cols; j++){
                    rows.push(value++)
                }
                matrix.push(rows)
            }
            return matrix
        }
        console.table(matrixUntil_100(10,10));
        
        
        
    </script>
