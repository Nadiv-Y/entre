<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-project</title>
    <link rel="stylesheet" href="/JS-project/project.css">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js" integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK" crossorigin="anonymous"></script>
</head>

<body>
    <FORM>
        <div class="container">
            <div class="header">
                <h1>my Task Board</h1>
            </div>
            <div class="main">
                <img class="paper" src="/JS-project/lib/paper texture.png" alt="">
                <input type="text"  class="overlay-input" id="insert-task" placeholder="Add Task here" >
                <button type="button" id="button-task-input" class="overlay-button" >Add</button>
                <input type="date" class="overlay-date" id="date-task">
                <input type="time" class="overlay-time" id="time-task">
                <button type="button" class="overlay-reset" id="Reset-task">Reset</button>
            </div>
            <div class="note note1" id="note-created"></div>
            <div class="note note2" id="note-created"></div>
            <div class="note note3" id="note-created"></div>
            <div class="note note4" id="note-created"></div>
        </div>
    </FORM>
</body>

</html>
