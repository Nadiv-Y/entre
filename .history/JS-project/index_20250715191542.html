<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Input & Button with Background Image</title>
  <style>
    .styled-input {
      padding: 10px 10px 10px 40px; /* space for the background image */
      background: url('input-icon.png') no-repeat 10px center;
      background-size: 20px 20px;
      width: 250px;
      font-size: 16px;
    }

    .styled-button {
      padding: 10px 20px 10px 40px;
      background: url('button-icon.png') no-repeat 10px center, #007BFF;
      background-size: 20px 20px;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .styled-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <input type="text" class="styled-input" placeholder="Search...">
  <button class="styled-button">Submit</button>

</body>
</html>
