<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Crypto View </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">


    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="card.css">
</head>

<body>
    <div class="page-wrapper">
        <div class="header ">
            <img src="../lib/shutterstock_1916262404_q3bjavcq.jpg" alt="img-coins" class="img-coins" />
            <div class="title sticky-title">
                <img src="../lib/CryptoView (6).gif" alt="gif-logo" class="gif">
                <h1>CryptoView</h1>
            </div>
        </div>


        <nav class="navbar navbar-expand-lg  nav-header nav-underline sticky-navbar " id="#">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo01"
                aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="container-fluid">


                <img src="../lib/CryptoView (6).gif" alt="gif-logo" class="gif-nav">
                <div class="collapse navbar-collapse p-3  div-collapse" id="navbarTogglerDemo01">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ul-nav-header">


                        <li class="nav-item">
                            <a class="nav-link active" href="#coins">Coins</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#realTimeReports">Real time reports</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#about">About</a>
                        </li>
                    </ul>
                </div>

            </div>
            <form class="d-flex filter-search" role="search">
                <input class="form-control me-2 filter" type="search" placeholder="Search" aria-label="Search" />
                <button class="btn btn-outline-light search" type="button">Search</button>
            </form>
        </nav>

        <div class="container-content">
            <div class="coins">
                <h2 id="coins" class="Subtitle ">Coins</h2>
                <div class="coins-cards">

                </div>
            </div>
            <div class="realTimeReports">
                <h2 id="realTimeReports" class="Subtitle">Real time reports</h2>

            </div>
            <div class="about">
                <h2 id="about" class="Subtitle">About</h2>

                <a href=""></a>
            </div>
        </div>

    </div>

    <!-- Modal -->
    <div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="myModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered d-flex justify-content-center">
            <div class="modal-content text-center" style="margin: 0 auto;">
                <div class="modal-header">
                    <h3 class="modal-title" id="myModalLabel">deviation!</h3>

                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div >
                   <div class="modal-content-deviation">You have exceeded the number of possible choices.</div>
                <div class="modal-body">
                 
                   
                   
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary modal-save-change" data-bs-dismiss="modal">save
                        changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>

 

    <script src="main.js"></script>
</body>

</html>
